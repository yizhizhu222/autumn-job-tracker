name: Build Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ai.txt "pyinstaller>=6.15,<7"
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_release.py
      - run: python tools/build_windows.py
      - name: Calculate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.zip | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - name: Publish verified packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem dist/*.zip | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @assets dist/SHA256SUMS.txt --title "Autumn Job Tracker $env:RELEASE_TAG" --notes-file docs/RELEASE.md --verify-tag
