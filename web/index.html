rong{display:block;font-size:29px;font-weight:600;line-height:1.4;font-variant-numeric:tabular-nums}.stat small{font-size:12px;color:var(--muted)}.stat small:last-child{font-size:10px}.toolbar,.actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px}.toolbar{margin-bottom:24px}.toolbar input[type=search]{flex:1;min-width:200px}.toolbar select{max-width:180px}button,.button,summary{font:inherit}button,.button{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid #dee2e6;border-radius:7px;background:#fff;color:#515963;padding:8px 12px;cursor:pointer;text-decoration:none;line-height:1.4;white-space:nowrap;font-size:12px}button:hover,.button:hover{border-color:#87a394;color:var(--accent);background:#f7faf8}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.primary:hover{background:#285944;color:#fff}.quiet{background:transparent;border-color:transparent;color:#8a8f98}.quiet:hover{background:#f1f3f5;border-color:transparent}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:21px 23px}.card{margin:12px 0}.panel{margin:0 0 16px}.job-card{padding:20px 23px}.company{color:#7a818d;font-size:12px;margin-bottom:3px}.job-top{align-items:flex-start}.job-title{font-size:18px;letter-spacing:-.25px;max-width:680px}.job-meta{font-size:12px;color:#8a9099;display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:8px}.salary{color:#397158;max-width:400px}.job-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:17px}.tag{display:inline-block;white-space:normal;font-size:11px;padding:3px 8px;border-radius:5px;background:#edf5f0;color:#38634e;vertical-align:middle}.amber{background:#fbf4e8;color:#9b7839}.gray{background:#f1f3f6;color:#89909b}.columns{display:grid;grid-template-columns:1fr 1fr;gap:26px}.box{background:#f7f9fa;border-radius:8px;padding:16px;margin:12px 0}.card ul,.box ul{padding-left:18px;margin:8px 0}.card li{margin:5px 0}.job-details{margin-top:15px;border-top:1px solid #eff0f2;padding-top:12px}.job-details>summary{color:#7b838d;font-size:12px}.job-details[open]>summary{margin-bottom:18px}.warning{color:#8b754b;background:#fcf8ee;padding:12px 15px;border-radius:7px;font-size:12px}.ok{color:#3c785b}.error{color:#b54747}.empty{padding:70px 20px;text-align:center;color:#8b929d;border:1px dashed #dee3e8;border-radius:12px;background:#fff}.section-label{font-size:12px;color:#7d8590;margin:24px 0 9px;display:flex;align-items:center;gap:10px}.section-label span{font-size:10px;padding:1px 6px;border-radius:4px;background:#e9edf1}details{margin-top:12px}summary{cursor:pointer;color:#5d6875;font-size:13px}input,select,textarea{font:inherit;border:1px solid #dfe4e8;border-radius:7px;padding:9px 11px;background:#fff;color:var(--ink);font-size:13px}textarea{width:100%;min-height:85px}input:focus,select:focus,textarea:focus{outline:2px solid #c9dfd2;outline-offset:1px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #93bba5;outline-offset:3px}label{display:block;margin:16px 0;font-size:13px}label input,label select{width:100%;margin-top:6px}dialog{width:min(760px,94vw);max-height:88vh;border:1px solid var(--line);border-radius:15px;padding:30px;box-shadow:0 20px 80px #18332422}dialog::backdrop{background:#12222f55;backdrop-filter:blur(2px)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px}th{font-weight:500;color:var(--muted)}.scroll{overflow:auto}.note{border-left:2px solid #bed4c7;padding-left:12px}.menu{position:relative;margin:0}.menu>summary{list-style:none;border:1px solid #dfe4e8;border-radius:7px;padding:8px 12px;background:#fff;font-size:12px}.menu[open] .menu-pop{position:absolute;right:0;top:40px;min-width:175px;display:flex;flex-direction:column;gap:4px;background:white;padding:10px;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 35px #17 </style></head><body>
<aside class="sidebar"><div class="brand"><span>J</span> 求职工作台<div class="eyebrow">AUTUMN JOB TRACKER</div></div><nav aria-label="主导航"><div class="nav-label">发现机会</div><button class="active" data-tab="recommend">今日推荐</button><button data-tab="ready">岗位直达</button><button data-tab="career">简历与项目</button><div class="nav-label">我的求职</div><button data-tab="history">已投记录</button><button data-tab="daily">投递统计</button><button data-tab="review">一周复盘</button><div class="nav-label">整理</div><button data-tab="excluded">不感兴趣</button><button data-tab="email">邮件渠道</button><button data-tab="backlog">待核实线索</button></nav><div class="sidebar-bottom"><p class="small muted"><span class="dot"></span>数据保存在本机</p><button id="startupButton">开机自启动设置</button></div></aside>
<main><header><div><h1 id="pageTitle">今日推荐</h1><p class="small muted">找到合适的下一步。</p></div><div class="header-tools"><button id="manual">＋ 登记已投</button><details class="menu"><summary>更多 ···</summary><div class="menu-pop"><button onclick="syncAll()">刷新数据</button><button id="addJob">添加岗位</button><button id="importJobs">导入岗位库</button><a class="button" href="/api/export/catalog" download="岗位库.json">导出岗位库</a><a class="button" href="投递记录.json" download>导出投递记录</a></div></details></div></header>
<div id="offline" class="warning hidden">请先打开本地看板程序，再刷新此页。</div>
<div class="stats"><div class="stat"><small>今日已投</small><strong id="todayN">—</strong><small id="todayBreakdown">按实际提交统计</small></div><div class="stat"><small>最近 7 天</small><strong id="weekN">—</strong><small>含今天</small></div><div class="stat"><small>累计投递</small><strong id="allN">—</strong><small>所有已登记申请</small></div><div class="stat"><small>待复盘</small><strong id="dueN">—</strong><small>满 7 天无实质回复</small></div></div>
<div id="onboarding"></div><div id="feedbackReminder"></div><div class="toolbar"><input type="search" id="search" aria-label="搜索公司或岗位" placeholder="搜索公司、岗位或关键词"><select id="group" aria-label="岗位方向"><option value="">全部方向</option></select><button id="regionButton"><span id="regionLabel">地域：不限</span></button><div id="dateTools" class="hidden"><input type="date" id="dateFilter" aria-label="投递日期"><button id="clearDate">清除</button></div><input id="importFile" type="file" accept=".json,application/json" hidden></div>
<div id="intro"></div><div id="content"></div>
<details class="resume-library"><summary>简历文件与使用说明</summary><div class="panel"><div id="originals" class="actions"></div><button data-upload-resume>导入 PDF / 文本简历</button><p id="rules" class="muted"></p><p class="small muted">成功提交后再登记。点击网页、下载简历不会增加投递数量。匹配分析不代表录用概率。</p></div></details>
<footer class="footer"><span id="sync">正在连接本地数据…</span></footer></main>
<dialog id="modal"><form id="form"><h2 id="modalTitle"></h2><div id="fields"></div><p id="formError" class="error"></p><div class="actions"><button type="submit" class="primary" id="save">保存记录</button><button type="button" onclick="document.querySelector('#modal').close()">取消</button></div></form></dialog>
<script>
let jobPreferences={province:'',city:'',include_unknown:true,rules:[]},regions={},companyGroups=[],feedbackState={due:[],items:{},advice:{}},allowedKeys=new Set(),excludedKeys=new Set();
const FALLBACK={"jobs": [], "originals": {}, "rules": "离线管理岗位、简历版本、实际投递与后续进展。"};
let catalog=FALLBACK,ledger={applications:{}},token='',today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),tab='recommend',mode='',activeKey='',connected=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=items=>'<ul>'+(Array.isArray(items)?items:[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
const days=(a,b)=>Math.floor((Date.parse(a+'T00:00:00+08:00')-Date.parse(b+'T00:00:00+08:00'))/86400000);
const due=a=>['等待回复','自动回执'].includes(a.progress)&&days(today,a.applied_date)>=7;
const pathlink=p=>{const value=String(p||'').replace(/\\/g,'/');return /^(resumes|原版简历|简历定制)\//.test(value)&&!value.split('/').includes('..')?value.split('/').map(encodeURIComponent).join('/'):'#';};
const safeUrl=u=>{try{const x=new URL(u);return ['http:','https:'].includes(x.protocol)&&!x.username&&!x.password?x.href:'#';}catch{return '#';}};
const normalize=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
function wasApplied(j){const aliases=new Set([j.key,...(j.aliases||[])]);return Object.values(ledger.applications).some(a=>[a.key,...(a.aliases||[])].some(k=>aliases.has(k))||(normalize(a.company)===normalize(j.company)&&normalize(a.role)===normalize(j.role)));}
function availableJob(j){return allowedKeys.has(j.key)&&!excludedKeys.has(j.key)&&!wasApplied(j);}
function commonFilter(x){const q=$('#search').value.trim().toLowerCase();return (!q||JSON.stringify(x).toLowerCase().includes(q))&&(!$('#group').value||x.group===$('#group').value||catalog.jobs.find(j=>j.key===x.key)?.group===$('#group').value);}
let loadSequence=0,lastStateSignature="";
async function load(){const sequence=++loadSequence;try{if(location.protocol==='file:')throw Error('offline');const r=await fetch('/api/state');if(!r.ok)throw Error('读取失败');const d=await r.json();if(sequence!==loadSequence)return;const signature=JSON.stringify(d);if(signature===lastStateSignature)return;lastStateSignature=signature;catalog=d.catalog;ledger=d.ledger;feedbackState=d.feedback||feedbackState;jobPreferences=d.preferences||jobPreferences;regions=d.regions||{};companyGroups=d.companies||[];allowedKeys=new Set(d.allowed_keys||catalog.jobs.map(j=>j.key));excludedKeys=new Set(d.excluded_keys||[]);token=d.token;today=d.today;connected=true;$('#sync').textContent='数据目录：'+d.data_dir+' · '+today;$('#offline').classList.add('hidden');}catch(e){if(sequence!==loadSequence)return;lastStateSignature='';connected=false;$('#sync').textContent='只读预览 · 未加载实际投递记录';$('#offline').classList.remove('hidden');}setup();render();}
function setup(){if(typeof setupRegion==='function')setupRegion();const prev=$('#group').value;$('#group').innerHTML='<option value="">全部方向</option>'+[...new Set(catalog.jobs.map(j=>j.group))].map(g=>'<option>'+esc(g)+'</option>').join('');$('#group').value=prev;$('#rules').textContent=catalog.rules;$('#originals').innerHTML=Object.entries((catalog.originals||{})).map(([name,r])=>'<a class="button" target="_blank" href="'+pathlink(r.path)+'">'+esc(name)+' · 原版</a>').join('');$('#manual').disabled=!connected;$('#addJob').disabled=!connected;$('#importJobs').disabled=!connected;}
function jobCard(j){const r=j.resume||{},link=safeUrl(j.apply_url),file=pathlink(r.path),marked=wasApplied(j)||excludedKeys.has(j.key);return `<article class="card job-card" data-job="${esc(j.key)}"><div class="job-top"><div><div class="company">${esc(j.company)}${j.group?' · '+esc(j.group):''}</div><h3 class="job-title">${esc(j.role)}</h3><div class="job-meta"><span>${esc(j.place||'地点待确认')}</span><span class="salary">${esc(j.salary||'薪资待确认')}</span><span>${j.online_confirmed?'支持线上面试':'线上面试待确认'}</span></div></div><span class="tag ${/待|低/.test(j.match||'')?'gray':''}">匹配 ${esc(j.match||'待分析')}</span></div><div class="job-bottom"><span class="small muted">${esc(j.channel==='email'?'邮件渠道':j.platform|| (j.direct?'岗位网页':'待核实线索'))}${r.base?' · 简历：'+esc(r.base):''}</span><div class="actions">${link!=='#'?`<a class="button primary" href="${esc(link)}" target="_blank" rel="noopener noreferrer">${j.direct&&j.channel!=='email'?'查看岗位 ↗':'查看来源 ↗'}</a>`:''}<button data-mark="${esc(j.key)}" ${!connected||marked?'disabled':''}>已投递</button><button class="quiet" data-exclude="${esc(j.key)}" ${!connected||marked?'disabled':''}>不感兴趣</button></div></div><details class="job-details" data-detail="job-${esc(j.key)}"><summary>岗位详情、匹配分析与简历</summary><div class="columns"><div><b>工作内容</b>${list(j.duties)}<b>申请要求</b>${list(j.requirements)}<p class="small muted">${esc(j.online)} · ${esc(j.deadline)}</p></div><div><b>符合的地方</b>${list(j.strengths)}<b>短板与待确认</b>${list(j.gaps)}<p class="small muted">${esc(j.confidence)}</p></div></div>${j.recommendation_warnings?.length?`<details><summary>需要核实的条件</summary>${list(j.recommendation_warnings)}</details>`:''}<div class="box"><b>建议简历：${esc(r.base||'待选择')}</b><p class="small">${esc(j.resume_reason||j.change_note||'使用与岗位方向对应的版本。')}</p>${r.after?`<p class="small muted">修改前：${esc(r.before)}<br>修改后：${esc(r.after)}</p>`:''}<div class="actions">${file!=='#'?`<a class="button" href="${file}" target="_blank">预览简历</a><a class="button" href="${file}" download>下载简历</a>`:'<span class="small muted">暂无可用文件</span>'}<button data-ai="${esc(j.key)}">AI 微调</button></div></div>${j.notes?`<p class="small muted">${esc(j.notes)}</p>`:''}<p class="small muted">${esc(j.recommendation_origin||'')} · 核实于 ${esc(j.verified_on||'待确认')} <a href="${esc(safeUrl(j.source))}" target="_blank" rel="noreferrer">原始来源 ↗</a></p></details></article>`;}
function historyCard(a,review=false){return `<article class="card"><span class="tag">${esc(a.progress)}</span><span class="tag gray">${esc(a.applied_date)} · 已过${days(today,a.applied_date)}天</span><h3>${esc(a.company)} · ${esc(a.role)}</h3><details class="job-details" data-detail="history-${esc(a.key)}"><summary>投递依据、简历与匹配记录</summary><p><b>使用简历：</b>${esc(a.resume_used||'未记录')}</p><p><b>投递依据：</b>${esc(a.evidence_type)} · ${esc(a.evidence||'')}</p><div class="columns"><div><b>匹配度：${esc(a.match||'待分析')}</b>${list(a.strengths)}</div><div><b>短板 / 待确认</b>${list(a.gaps)}</div></div>${a.changes?.after?`<div class="box small">修改前：${esc(a.changes.before)}<br>修改后：${esc(a.changes.after)}</div>`:''}<p><b>备注：</b>${esc(a.notes||'暂无')}</p>${a.job_snapshot?`<details><summary>查看投递时的岗位信息</summary><p>${esc(a.job_snapshot.place)} · ${esc(a.job_snapshot.salary)}</p><b>职责</b>${list(a.job_snapshot.duties)}<b>要求</b>${list(a.job_snapshot.requirements)}<p>${esc(a.job_snapshot.online)}</p><a href="${esc(safeUrl(a.job_snapshot.source))}" target="_blank" rel="noreferrer">当时的信息来源</a></details>`:''}</details>${review?`<div class="box"><b>一周复盘</b><p>${esc(a.review||a.review_hint||'先核对提交回执、岗位是否仍开放、招聘批次进度与原JD必需条件。暂时没有足够证据判断未回复原因。')}</p><p class="small">下一步：检查邮箱/垃圾箱与网申进度；若岗位仍开放且条件匹配，可准备一次简短询问。继续投新岗位，不重复提交同一岗位。</p><p class="small muted">${a.reviewed_at?'最近分析：'+esc(a.reviewed_at):'可结合最新岗位和邮件进展补充分析。'}</p></div>`:''}<div class="actions"><button data-feedback="${esc(a.key)}">${feedbackState.items[a.key]?.length?'反馈与建议':'填写反馈与查看建议'}</button><button data-mail-track="${esc(a.key)}">邮件与回执跟踪</button><button data-update="${esc(a.key)}" ${!connected?'disabled':''}>更新进度 / 日期</button><button data-undo="${esc(a.key)}" ${!connected?'disabled':''}>撤销误登记</button></div></article>`;}
function render(){const opened=[...document.querySelectorAll('#content details[data-detail][open]')].map(d=>d.dataset.detail);renderView();renderFeedbackReminder();renderOnboarding();if(tab==='history'){const b=document.createElement('button');b.textContent='邮箱连接与检查';b.onclick=openMailSettings;$('#intro').append(b);}document.querySelectorAll('#content details[data-detail]').forEach(d=>{if(opened.includes(d.dataset.detail))d.open=true;});}
function renderView(){const titles={recommend:'今日推荐',ready:'岗位直达',career:'简历与项目',history:'已投记录',daily:'投递统计',review:'一周复盘',excluded:'不感兴趣',email:'邮件渠道',backlog:'待核实线索'};$('#pageTitle').textContent=titles[tab];$('#dateTools').classList.toggle('hidden',!['history','daily','review'].includes(tab));const apps=Object.values(ledger.applications),tod=apps.filter(a=>a.applied_date===today);$('#todayN').textContent=connected?tod.length:'—';$('#todayBreakdown').textContent=connected?'回执确认 '+tod.filter(a=>a.evidence_type!=='本人登记').length+' · 本人登记 '+tod.filter(a=>a.evidence_type==='本人登记').length:'先打开可保存版本';$('#weekN').textContent=connected?apps.filter(a=>days(today,a.applied_date)>=0&&days(today,a.applied_date)<7).length:'—';$('#allN').textContent=connected?apps.length:'—';$('#dueN').textContent=connected?apps.filter(due).length:'—';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const intro=$('#intro'),content=$('#content');let selected=[];
if(tab==='recommend'||tab==='ready'){renderRecommendations();return;}
if(tab==='career'){renderCareer();return;}
if(tab==='excluded'){renderExclusions();return;}
if(tab==='ready'||tab==='backlog'||tab==='email'){selected=catalog.jobs.filter(j=>availableJob(j)&&commonFilter(j)&&(tab==='ready'?j.direct&&j.channel==='web':tab==='email'?j.channel==='email':!j.direct&&j.channel!=='email'));intro.innerHTML=tab==='ready'?'<div class="warning">已准备网页入口的未投岗位。详情中查看要求与简历。</div>':tab==='email'?'<div class="warning">仅提供邮件申请的机会；按钮打开企业官网说明。</div>':'<p class="muted">这些线索尚缺具体入口或完整JD，可继续补全。已投岗位不会出现在此处或首页。</p>';content.innerHTML=companyCards(selected)||'<div class="empty">当前没有符合筛选条件的未投岗位。可点击“添加岗位”或“导入岗位库”开始。</div>';}
else if(tab==='daily'){intro.innerHTML='<p class="muted">仅统计已登记的真实提交。每天的明细可通过日期筛选查看。</p>';const counts={};for(let i=0;i<7;i++){const d=new Date(Date.parse(today+'T12:00:00+08:00')-i*86400000).toISOString().slice(0,10);counts[d]=[];}for(const a of apps.filter(commonFilter))(counts[a.applied_date]??=[]).push(a);content.innerHTML='<div class="panel scroll"><table><thead><tr><th>投递日期</th><th>实际已投</th><th>岗位明细</th></tr></thead><tbody>'+Object.keys(counts).sort().reverse().filter(d=>!$('#dateFilter').value||d===$('#dateFilter').value).map(d=>`<tr><td>${d}</td><td>${counts[d].length}</td><td>${counts[d].map(a=>esc(a.company)+' · '+esc(a.role)).join('<br>')}</td></tr>`).join('')+'</tbody></table></div>';}
else{selected=apps.filter(a=>commonFilter(a)&&(!$('#dateFilter').value||a.applied_date===$('#dateFilter').value)&&(tab!=='review'||due(a))).sort((a,b)=>b.applied_date.localeCompare(a.applied_date));intro.innerHTML=tab==='review'?'<p class="muted">从投递日起满7个自然日，且只有自动回执或没有实质进展的申请。无回复原因必须依据证据分析；不能直接判断被拒。</p>':'<p class="muted">集中保存已投岗位、日期、匹配分析、简历版本与招聘进展，第二天自动排除重复推荐。</p>';content.innerHTML=selected.map(a=>historyCard(a,tab==='review')).join('')||'<div class="empty">暂无此类记录。</div>';}
}
function openForm(kind,key=''){mode=kind;activeKey=key;$('#formError').textContent='';const a=ledger.applications[key],j=catalog.jobs.find(j=>j.key===key);let fields='';if(kind==='add_job'){openJobForm();return;}$('#modalTitle').textContent=kind==='mark'?'登记成功投递':kind==='manual'?'补录其他渠道已投岗位':'更新投递进度';if(kind==='manual')fields+='<label>公司<input name="company" required></label><label>岗位名称 / 岗位ID<input name="role" required></label><label>岗位链接<input name="source" type="url"></label>';else fields+='<p>'+esc((a||j).company)+' · '+esc((a||j).role)+'</p>';fields+=`<label>实际投递日期<input name="date" type="date" value="${a?.applied_date||today}" max="${today}" required></label>`;if(kind==='update'){fields+='<label>当前进度<select name="progress">'+['等待回复','自动回执','补材料','测评邀请','面试邀请','面试中','录用','拒绝','撤回'].map(p=>`<option ${p===a.progress?'selected':''}>${p}</option>`).join('')+'</select></label>'+`<label>最近实质回复日期<input type="date" name="response_date" value="${a.last_response_date||today}" max="${today}"></label>`;}else{if(j?.channel==='email')fields+='<input type="hidden" name="application_channel" value="email">'+mailFields(j);fields+=`<label>实际使用简历<input name="resume" value="${esc(j?.resume?.path||'')}" required></label><label>成功提交依据 / 回执说明<input name="evidence" placeholder="例如：平台显示提交成功；或已发送邮件" required></label><p class="small muted">仅在已完成实际提交后保存。本按钮只登记，不会替你投递。</p>`;}fields+=`<label>备注<textarea name="notes">${esc(a?.notes||'')}</textarea></label>`;$('#fields').innerHTML=fields;$('#modal').showModal();}
async function change(payload){const r=await fetch('/api/change',{method:'POST',headers:{'Content-Type':'application/json','X-Tracker-Token':token},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||'保存失败');loadSequence++;lastStateSignature='';ledger=d.ledger;if(d.catalog)catalog=d.catalog;await syncAll();signalChange();$('#sync').textContent='已保存到本机 · '+new Date().toLocaleTimeString('zh-CN');render();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();syncAll();});$('#search').oninput=render;$('#group').onchange=render;$('#dateFilter').onchange=()=>{if(tab==='ready'||tab==='backlog'||tab==='email')tab='history';render();};$('#clearDate').onclick=()=>{$('#dateFilter').value='';render();};$('#manual').onclick=()=>openForm('manual');
$('#content').onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.mark)openForm('mark',b.dataset.mark);if(b.dataset.update)openForm('update',b.dataset.update);if(b.dataset.undo&&confirm('仅撤销这条本地误登记，并保留恢复记录；不会向招聘方撤回申请。确定？')){try{await change({op:'undo',key:b.dataset.undo});}catch(e){alert(e.message);}}};
$('#form').onsubmit=async ev=>{ev.preventDefault();$('#save').disabled=true;try{const payload=Object.fromEntries(new FormData(ev.target));payload.op=mode;payload.key=activeKey;await change(payload);$('#modal').close();}catch(e){$('#formError').textContent=e.message;}finally{$('#save').disabled=false;}};
function openJobForm(){
 $('#modalTitle').textContent='添加待投岗位';
 const fields=[['company','公司名称',true],['role','岗位名称 / 岗位ID',true],['url','直接申请网页（HTTP/HTTPS）',false],['group','方向分类',false],['place','地点',false],['salary','薪资',false],['deadline','截止时间',false],['online','面试方式',false],['resume','简历相对路径，例如 resumes/resume.pdf',false],['match','匹配度，例如中等 / 待评估',false]];
 $('#fields').innerHTML=fields.map(([key,label,required])=>`<label>${label}<input name="${key}" ${required?'required':''} ${key==='url'?'type="url"':''}></label>`).join('')+[['duties','岗位职责（每行一条）'],['requirements','申请要求（每行一条）'],['strengths','匹配理由（每行一条）'],['gaps','短板与待确认（每行一条）'],['notes','备注']].map(([key,label])=>`<label>${label}<textarea name="${key}"></textarea></label>`).join('');
 $('#modal').showModal();
}
$('#addJob').onclick=()=>openForm('add_job');
$('#importJobs').onclick=()=>$('#importFile').click();
$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>8000000)throw Error('文件超过8MB');const data=JSON.parse(await f.text());if(!Array.isArray(data.jobs))throw Error('请选择包含jobs数组的岗位库JSON');await change({op:'import_catalog',catalog:data});alert('导入完成；已有相同岗位已跳过。');}catch(err){alert(err.message);}finally{e.target.value='';}};


</script><script src="/assistant.js"></script><script src="/features.js"></script><script src="/company.js"></script><script src="/feedback.js"></script><script src="/onboarding.js"></script><script>
let syncBusy=false;
async function syncAll(){await load();await Promise.all([refreshAssistant(),refreshCareer(),refreshMailbox()]);}
function signalChange(){try{localStorage.setItem('tracker-changed',String(Date.now())+'-'+Math.random());}catch{}}
window.addEventListener('storage',e=>{if(e.key==='tracker-changed')syncAll();});
window.addEventListener('focus',()=>syncAll());
setInterval(async()=>{if(!document.hidden&&!syncBusy){syncBusy=true;try{await syncAll();}finally{syncBusy=false;}}},15000);
document.querySelectorAll('.menu-pop button,.menu-pop a').forEach(b=>b.addEventListener('click',()=>b.closest('details').open=false));
syncAll();
</script></body></html>
